<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="#041525"/>

  <!-- Magnifying glass frame -->
  <circle cx="400" cy="260" r="140" fill="none" stroke="#d4a843" stroke-width="4"/>
  <circle cx="400" cy="260" r="134" fill="none" stroke="#d4a843" stroke-width="1" opacity="0.4"/>
  <line x1="505" y1="365" x2="580" y2="440" stroke="#d4a843" stroke-width="8" stroke-linecap="round"/>
  <circle cx="400" cy="260" r="120" fill="#041525" opacity="0.6"/>

  <!-- Text lines inside magnifying glass -->
  <rect x="310" y="200" width="140" height="3" rx="1.5" fill="#f0e6d0" opacity="0.5"/>
  <rect x="320" y="220" width="120" height="3" rx="1.5" fill="#f0e6d0" opacity="0.4"/>
  <rect x="310" y="240" width="130" height="3" rx="1.5" fill="#f0e6d0" opacity="0.5"/>
  <rect x="325" y="260" width="100" height="3" rx="1.5" fill="#f0e6d0" opacity="0.4"/>
  <rect x="310" y="280" width="135" height="3" rx="1.5" fill="#f0e6d0" opacity="0.5"/>
  <rect x="330" y="300" width="90" height="3" rx="1.5" fill="#f0e6d0" opacity="0.3"/>

  <!-- Sentiment dots scattered around -->
  <!-- Positive (green) -->
  <circle cx="200" cy="150" r="10" fill="#4CAF50" opacity="0.8" filter="url(#glow2)"/>
  <circle cx="160" cy="250" r="8" fill="#4CAF50" opacity="0.7" filter="url(#glow2)"/>
  <circle cx="600" cy="180" r="9" fill="#4CAF50" opacity="0.8" filter="url(#glow2)"/>
  <circle cx="650" cy="300" r="7" fill="#4CAF50" opacity="0.6" filter="url(#glow2)"/>
  <circle cx="180" cy="380" r="8" fill="#4CAF50" opacity="0.7" filter="url(#glow2)"/>

  <!-- Negative (red) -->
  <circle cx="250" cy="120" r="8" fill="#e74c3c" opacity="0.8" filter="url(#glow2)"/>
  <circle cx="580" cy="130" r="10" fill="#e74c3c" opacity="0.7" filter="url(#glow2)"/>
  <circle cx="130" cy="340" r="9" fill="#e74c3c" opacity="0.8" filter="url(#glow2)"/>
  <circle cx="670" cy="220" r="7" fill="#e74c3c" opacity="0.6" filter="url(#glow2)"/>
  <circle cx="620" cy="380" r="8" fill="#e74c3c" opacity="0.7" filter="url(#glow2)"/>

  <!-- Neutral (yellow) -->
  <circle cx="300" cy="100" r="7" fill="#f1c40f" opacity="0.7" filter="url(#glow2)"/>
  <circle cx="520" cy="110" r="9" fill="#f1c40f" opacity="0.8" filter="url(#glow2)"/>
  <circle cx="140" cy="200" r="6" fill="#f1c40f" opacity="0.6" filter="url(#glow2)"/>
  <circle cx="680" cy="160" r="8" fill="#f1c40f" opacity="0.7" filter="url(#glow2)"/>
  <circle cx="230" cy="400" r="7" fill="#f1c40f" opacity="0.7" filter="url(#glow2)"/>
  <circle cx="550" cy="400" r="6" fill="#f1c40f" opacity="0.6" filter="url(#glow2)"/>

  <!-- Bar chart below -->
  <line x1="250" y1="520" x2="550" y2="520" stroke="#d4a843" stroke-width="1.5" opacity="0.6"/>
  <line x1="250" y1="480" x2="550" y2="480" stroke="#d4a843" stroke-width="0.5" opacity="0.2"/>
  <line x1="250" y1="500" x2="550" y2="500" stroke="#d4a843" stroke-width="0.5" opacity="0.2"/>

  <rect x="280" y="460" width="30" height="60" rx="2" fill="#d4a843" opacity="0.9"/>
  <rect x="330" y="440" width="30" height="80" rx="2" fill="#d4a843" opacity="0.9"/>
  <rect x="380" y="470" width="30" height="50" rx="2" fill="#d4a843" opacity="0.7"/>
  <rect x="430" y="450" width="30" height="70" rx="2" fill="#d4a843" opacity="0.8"/>
  <rect x="480" y="430" width="30" height="90" rx="2" fill="#f0e6d0" opacity="0.9"/>

  <!-- Small decorative elements -->
  <circle cx="720" cy="480" r="2" fill="#d4a843" opacity="0.3"/>
  <circle cx="80" cy="480" r="2" fill="#d4a843" opacity="0.3"/>
</svg>