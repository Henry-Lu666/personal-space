<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="#041525"/>

  <!-- Hexagon helper: points for regular hexagon centered at cx,cy with radius r -->
  <!-- 5 hexagonal nodes -->
  <!-- Node 1: Extract -->
  <polygon points="80,300 110,280 140,300 140,340 110,360 80,340"
           fill="none" stroke="#d4a843" stroke-width="2.5" filter="url(#glow4)"/>
  <polygon points="88,305 110,290 132,305 132,335 110,350 88,335"
           fill="#d4a843" opacity="0.1"/>
  <circle cx="110" cy="320" r="8" fill="#d4a843" opacity="0.7"/>

  <!-- Node 2: Transform -->
  <polygon points="210,300 240,280 270,300 270,340 240,360 210,340"
           fill="none" stroke="#d4a843" stroke-width="2.5" filter="url(#glow4)"/>
  <polygon points="218,305 240,290 262,305 262,335 240,350 218,335"
           fill="#d4a843" opacity="0.1"/>
  <rect x="232" y="312" width="16" height="16" rx="2" fill="none" stroke="#d4a843" stroke-width="1.5" transform="rotate(45,240,320)"/>

  <!-- Node 3: Validate -->
  <polygon points="340,300 370,280 400,300 400,340 370,360 340,340"
           fill="none" stroke="#d4a843" stroke-width="2.5" filter="url(#glow4)"/>
  <polygon points="348,305 370,290 392,305 392,335 370,350 348,335"
           fill="#d4a843" opacity="0.1"/>
  <circle cx="370" cy="320" r="6" fill="none" stroke="#d4a843" stroke-width="1.5"/>
  <polyline points="365,320 368,324 376,316" fill="none" stroke="#d4a843" stroke-width="1.5"/>

  <!-- Node 4: Load -->
  <polygon points="470,300 500,280 530,300 530,340 500,360 470,340"
           fill="none" stroke="#d4a843" stroke-width="2.5" filter="url(#glow4)"/>
  <polygon points="478,305 500,290 522,305 522,335 500,350 478,335"
           fill="#d4a843" opacity="0.1"/>
  <polygon points="500,308 510,320 500,332 490,320" fill="none" stroke="#d4a843" stroke-width="1.5"/>

  <!-- Node 5: Deploy -->
  <polygon points="600,300 630,280 660,300 660,340 630,360 600,340"
           fill="none" stroke="#d4a843" stroke-width="2.5" filter="url(#glow4)"/>
  <polygon points="608,305 630,290 652,305 652,335 630,350 608,335"
           fill="#d4a843" opacity="0.1"/>
  <polygon points="622,310 630,305 638,310 638,330 630,335 622,330" fill="none" stroke="#d4a843" stroke-width="1.5"/>

  <!-- Connecting lines between nodes -->
  <line x1="140" y1="320" x2="210" y2="320" stroke="#f0e6d0" stroke-width="1.5" opacity="0.5"/>
  <line x1="270" y1="320" x2="340" y2="320" stroke="#f0e6d0" stroke-width="1.5" opacity="0.5"/>
  <line x1="400" y1="320" x2="470" y2="320" stroke="#f0e6d0" stroke-width="1.5" opacity="0.5"/>
  <line x1="530" y1="320" x2="600" y2="320" stroke="#f0e6d0" stroke-width="1.5" opacity="0.5"/>

  <!-- Data particles flowing between nodes -->
  <circle cx="165" cy="318" r="3" fill="#f0e6d0" opacity="0.7"/>
  <circle cx="180" cy="322" r="2" fill="#d4a843" opacity="0.6"/>
  <circle cx="195" cy="319" r="2.5" fill="#f0e6d0" opacity="0.5"/>

  <circle cx="295" cy="317" r="2.5" fill="#d4a843" opacity="0.7"/>
  <circle cx="310" cy="323" r="2" fill="#f0e6d0" opacity="0.6"/>
  <circle cx="325" cy="318" r="3" fill="#d4a843" opacity="0.5"/>

  <circle cx="425" cy="320" r="2" fill="#f0e6d0" opacity="0.7"/>
  <circle cx="440" cy="316" r="3" fill="#d4a843" opacity="0.6"/>
  <circle cx="455" cy="322" r="2" fill="#f0e6d0" opacity="0.5"/>

  <circle cx="555" cy="318" r="2.5" fill="#d4a843" opacity="0.7"/>
  <circle cx="570" cy="323" r="2" fill="#f0e6d0" opacity="0.6"/>
  <circle cx="585" cy="317" r="3" fill="#d4a843" opacity="0.5"/>

  <!-- Additional floating particles for atmosphere -->
  <circle cx="150" cy="200" r="2" fill="#f0e6d0" opacity="0.2"/>
  <circle cx="350" cy="180" r="1.5" fill="#d4a843" opacity="0.25"/>
  <circle cx="550" cy="210" r="2" fill="#f0e6d0" opacity="0.2"/>
  <circle cx="450" cy="420" r="1.5" fill="#d4a843" opacity="0.2"/>
  <circle cx="250" cy="430" r="2" fill="#f0e6d0" opacity="0.15"/>
  <circle cx="650" cy="400" r="1.5" fill="#d4a843" opacity="0.2"/>

  <!-- Directional arrows between hexagons -->
  <polygon points="193,316 200,320 193,324" fill="#d4a843" opacity="0.6"/>
  <polygon points="323,316 330,320 323,324" fill="#d4a843" opacity="0.6"/>
  <polygon points="453,316 460,320 453,324" fill="#d4a843" opacity="0.6"/>
  <polygon points="583,316 590,320 583,324" fill="#d4a843" opacity="0.6"/>
</svg>