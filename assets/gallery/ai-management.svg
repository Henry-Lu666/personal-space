<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bridge1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4a843" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f0e6d0" stop-opacity="1"/>
      <stop offset="100%" stop-color="#d4a843" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="#041525"/>

  <!-- Neural network left side -->
  <line x1="120" y1="180" x2="220" y2="280" stroke="#f0e6d0" stroke-width="1.2" opacity="0.4"/>
  <line x1="120" y1="180" x2="200" y2="180" stroke="#f0e6d0" stroke-width="1.2" opacity="0.4"/>
  <line x1="120" y1="180" x2="210" y2="380" stroke="#f0e6d0" stroke-width="1.2" opacity="0.3"/>
  <line x1="80" y1="300" x2="200" y2="180" stroke="#f0e6d0" stroke-width="1.2" opacity="0.4"/>
  <line x1="80" y1="300" x2="220" y2="280" stroke="#f0e6d0" stroke-width="1.2" opacity="0.4"/>
  <line x1="80" y1="300" x2="210" y2="380" stroke="#f0e6d0" stroke-width="1.2" opacity="0.4"/>
  <line x1="120" y1="420" x2="220" y2="280" stroke="#f0e6d0" stroke-width="1.2" opacity="0.3"/>
  <line x1="120" y1="420" x2="210" y2="380" stroke="#f0e6d0" stroke-width="1.2" opacity="0.4"/>
  <line x1="120" y1="420" x2="200" y2="180" stroke="#f0e6d0" stroke-width="1.2" opacity="0.3"/>
  <line x1="200" y1="180" x2="220" y2="280" stroke="#f0e6d0" stroke-width="1.2" opacity="0.5"/>
  <line x1="220" y1="280" x2="210" y2="380" stroke="#f0e6d0" stroke-width="1.2" opacity="0.5"/>

  <circle cx="120" cy="180" r="12" fill="#d4a843" filter="url(#glow1)"/>
  <circle cx="80" cy="300" r="10" fill="#d4a843" filter="url(#glow1)"/>
  <circle cx="120" cy="420" r="12" fill="#d4a843" filter="url(#glow1)"/>
  <circle cx="200" cy="180" r="9" fill="#d4a843" filter="url(#glow1)"/>
  <circle cx="220" cy="280" r="11" fill="#d4a843" filter="url(#glow1)"/>
  <circle cx="210" cy="380" r="10" fill="#d4a843" filter="url(#glow1)"/>
  <circle cx="160" cy="250" r="7" fill="#d4a843" opacity="0.6" filter="url(#glow1)"/>
  <circle cx="170" cy="340" r="8" fill="#d4a843" opacity="0.6" filter="url(#glow1)"/>

  <!-- Glowing bridge -->
  <rect x="290" y="270" width="220" height="60" rx="30" fill="url(#bridge1)" opacity="0.15"/>
  <line x1="290" y1="290" x2="510" y2="290" stroke="#d4a843" stroke-width="2" opacity="0.6" stroke-dasharray="8,4"/>
  <line x1="290" y1="310" x2="510" y2="310" stroke="#f0e6d0" stroke-width="1.5" opacity="0.4" stroke-dasharray="6,6"/>
  <circle cx="350" cy="300" r="4" fill="#d4a843" opacity="0.7"/>
  <circle cx="400" cy="300" r="5" fill="#f0e6d0" opacity="0.5"/>
