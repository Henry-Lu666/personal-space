  <circle cx="610" cy="276" r="5" fill="#d4a843"/>
  <rect x="650" y="260" width="60" height="32" rx="4" fill="none" stroke="#d4a843" stroke-width="1.5"/>
  <circle cx="680" cy="276" r="5" fill="#d4a843"/>

  <line x1="540" y1="292" x2="540" y2="330" stroke="#f0e6d0" stroke-width="1.2" opacity="0.5"/>
  <line x1="680" y1="292" x2="680" y2="330" stroke="#f0e6d0" stroke-width="1.2" opacity="0.5"/>
  <line x1="510" y1="330" x2="570" y2="330" stroke="#f0e6d0" stroke-width="1.2" opacity="0.5"/>
  <line x1="650" y1="330" x2="710" y2="330" stroke="#f0e6d0" stroke-width="1.2" opacity="0.5"/>
  <line x1="510" y1="330" x2="510" y2="350" stroke="#f0e6d0" stroke-width="1.2" opacity="0.5"/>
  <line x1="540" y1="330" x2="540" y2="350" stroke="#f0e6d0" stroke-width="1.2" opacity="0.5"/>
  <line x1="680" y1="330" x2="680" y2="350" stroke="#f0e6d0" stroke-width="1.2" opacity="0.5"/>
  <line x1="710" y1="330" x2="710" y2="350" stroke="#f0e6d0" stroke-width="1.2" opacity="0.5"/>

  <rect x="490" y="350" width="40" height="28" rx="3" fill="none" stroke="#d4a843" stroke-width="1.2" opacity="0.8"/>
  <rect x="520" y="350" width="40" height="28" rx="3" fill="none" stroke="#d4a843" stroke-width="1.2" opacity="0.8"/>
  <rect x="660" y="350" width="40" height="28" rx="3" fill="none" stroke="#d4a843" stroke-width="1.2" opacity="0.8"/>
  <rect x="690" y="350" width="40" height="28" rx="3" fill="none" stroke="#d4a843" stroke-width="1.2" opacity="0.8"/>

